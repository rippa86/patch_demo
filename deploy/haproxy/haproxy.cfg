global
    log stdout format raw local0
    maxconn 4096
    stats socket 127.0.0.1:9999 level admin
    stats timeout 2s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option redispatch
    retries 2
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend shop
    bind *:80
    acl is_account path_beg /api/account
    acl is_login path_beg /api/login
    acl is_logout path_beg /api/logout
    acl is_cart path_beg /api/cart
    use_backend be_account if is_account
    use_backend be_login if is_login
    use_backend be_logout if is_logout
    use_backend be_cart if is_cart
    default_backend be_httpd

backend be_httpd
    balance roundrobin
    option httpchk GET /healthz.txt
    http-check expect status 200
    server web-frontend1.lab.rippa.io 10.10.4.115:8080 check inter 2s fall 3 rise 2
    server web-frontend2.lab.rippa.io 10.10.4.116:8080 check inter 2s fall 3 rise 2

backend be_account
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server web-frontend1.lab.rippa.io 10.10.4.115:8010 check inter 2s fall 3 rise 2
    server web-frontend2.lab.rippa.io 10.10.4.116:8010 check inter 2s fall 3 rise 2

