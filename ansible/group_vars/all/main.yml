---
# ============================================================================
# Lab settings: the only file you should need to edit.
# ============================================================================

# --- The one password -------------------------------------------------------
# Every secret in the lab is derived from this: MariaDB root/app/SST/monitor,
# 389-ds Directory Manager, LDAP api + admin + replication manager, JWT secret,
# internal token, Grafana admin.
# Set it ONE of these ways (never commit the real value):
#   ansible-playbook playbooks/site.yml -e lab_password='batman123!'
#   ansible-vault create group_vars/all/vault.yml   (contents: lab_password: ...)
# Allowed: 8+ characters, no spaces, quotes, $, `, \ or #.
# lab_password: (set via -e or vault)

# --- Network ----------------------------------------------------------------
lab_domain: lab.rippa.io
lab_subnet: 10.10.4.0/24
lab_prefix: 24

frontend1_name: web-frontend1
frontend1_ip: 10.10.4.115
frontend2_name: web-frontend2
frontend2_ip: 10.10.4.116
ops_name: demo-vm
ops_ip: 10.10.4.108

# --- Shop entry point (HAProxy on demo-vm) ----------------------------------
# HAProxy listens on shop_vip_ip:80. The playbook adds shop_vip_ip as a second
# address on demo-vm's main interface. Point DNS for shop_vip_dns at it.
shop_vip_dns: shoppingapp.lab.rippa.io
shop_vip_ip: 10.10.4.30
shop_url: "http://{{ shop_vip_dns }}"
haproxy_stats_port: 8404
grafana_port: 3000

# --- Application ------------------------------------------------------------
admin_users: [admin]
reserved_usernames: [admin, administrator, root, api]
jwt_expire_minutes: 30
ldap_suffix: dc=webstore,dc=local
ldap_people_ou: "ou=People,{{ ldap_suffix }}"
ldap_service_dn: "uid=api,ou=Services,{{ ldap_suffix }}"
ldap_repl_manager_dn: cn=replication manager,cn=config
ldap_port: 389
galera_cluster_name: webstore

# Optional extras
seed_test_users: true          # create user1..user100 (tools/create_accounts.py) at the end
synth_users_enabled: false     # old synthetic-users container on demo-vm
remove_legacy_dashboard: true  # stop/remove webstore-httpd-dash (replaced by Grafana)
httpd_direct_api_proxy: true   # make http://<frontend>:8080/api/* work without HAProxy

# --- Derived (no need to edit) ----------------------------------------------
frontend1_fqdn: "{{ frontend1_name }}.{{ lab_domain }}"
frontend2_fqdn: "{{ frontend2_name }}.{{ lab_domain }}"
ops_fqdn: "{{ ops_name }}.{{ lab_domain }}"
shop_nodes:
  - { name: "{{ frontend1_name }}", fqdn: "{{ frontend1_fqdn }}", ip: "{{ frontend1_ip }}" }
  - { name: "{{ frontend2_name }}", fqdn: "{{ frontend2_fqdn }}", ip: "{{ frontend2_ip }}" }
galera_cluster_address: "gcomm://{{ frontend1_ip }},{{ frontend2_ip }},{{ ops_ip }}"

repo_root: "{{ playbook_dir }}/../.."
repo_dest: /opt/webstore

# Images built on the shop hosts: name -> source dir (relative to repo root).
shop_images:
  backend: backend
  api-account: api-account
  api-login: api-login
  api-logout: api-logout
  api-cart: api-cart
  api-stats: api-stats
  api-admin: api-admin
  httpd: frontend

# Start order matters: backend needs MariaDB, APIs need the backend.
shop_api_units:
  - webstore-api-account.service
  - webstore-api-login.service
  - webstore-api-logout.service
  - webstore-api-cart.service
  - webstore-api-stats.service
  - webstore-api-admin.service
shop_app_units:
  - webstore-backend.service
  - webstore-httpd.service

# HAProxy backends (on demo-vm): name, path prefix, port on each shop node, health URL.
haproxy_api_backends:
  - { name: be_account, path: /api/account, port: 8010, check: /healthz }
  - { name: be_login,   path: /api/login,   port: 8011, check: /healthz }
  - { name: be_logout,  path: /api/logout,  port: 8012, check: /healthz }
  - { name: be_cart,    path: /api/cart,    port: 8013, check: /healthz }
  - { name: be_stats,   path: /api/stats,   port: 8014, check: /healthz }
  - { name: be_admin,   path: /api/admin,   port: 8015, check: /healthz }
haproxy_web_backend: { name: web_pool, port: 8080, check: /healthz.txt }
# Used by drain.yml / restore.yml (runtime socket on demo-vm).
haproxy_backends: "{{ ['web_pool'] + haproxy_api_backends | map(attribute='name') | list }}"
haproxy_socket: /var/lib/haproxy/stats

# --- Firewall ---------------------------------------------------------------
# Rules are added to the running firewall and the permanent config without a
# reload, so Podman's port forwarding is never flushed.
shop_firewall_lab_ports:      # open to lab_subnet on both frontends
  - 8080/tcp        # httpd (HAProxy health + direct access)
  - 8001/tcp        # backend (peer node fallback)
  - 8010-8013/tcp   # account, login, logout, cart APIs
  - 8015/tcp        # admin API
  - 3306/tcp        # MariaDB (peer, exporter)
  - 4444/tcp        # Galera SST
  - 4567/tcp        # Galera replication
  - 4567/udp
  - 4568/tcp        # Galera IST
  - 389/tcp         # LDAP (peer replication, exporter)
  - 636/tcp         # LDAPS
shop_firewall_ops_ports:      # open only to demo-vm
  - 8014/tcp        # api-stats
ops_firewall_public_ports:    # open to everyone on demo-vm
  - 80/tcp          # shop via HAProxy
  - "{{ haproxy_stats_port }}/tcp"
  - "{{ grafana_port }}/tcp"
ops_firewall_lab_ports:
  - 4567/tcp        # garbd
  - 4567/udp
