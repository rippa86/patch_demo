---
# End-to-end checks, run from demo-vm (it can reach everything).
#   ansible-playbook playbooks/smoke.yml -e lab_password='...'
- name: Smoke test
  hosts: webstore_ops
  become: true
  gather_facts: false
  vars:
    base: "http://{{ shop_vip_ip }}"
  tasks:
    - name: Shop page through HAProxy
      ansible.builtin.uri:
        url: "{{ base }}/"
      register: page
      until: page.status == 200
      retries: 10
      delay: 3

    - name: Products
      ansible.builtin.uri:
        url: "{{ base }}/api/cart/products"
      register: products
      failed_when: products.json | length < 3

    - name: Admin login
      ansible.builtin.uri:
        url: "{{ base }}/api/login"
        method: POST
        body_format: json
        body: { username: "{{ admin_users[0] }}", password: "{{ lab_password }}" }
      register: admin_login
      no_log: true

    - name: Admin API recognises the admin
      ansible.builtin.uri:
        url: "{{ base }}/api/admin/me"
        headers: { Authorization: "Bearer {{ admin_login.json.token }}" }

    - name: Logout
      ansible.builtin.uri:
        url: "{{ base }}/api/logout"
        method: POST
        headers: { Authorization: "Bearer {{ admin_login.json.token }}" }

    - name: Every HAProxy server is UP
      ansible.builtin.shell: |
        echo "show stat" | socat stdio unix-connect:{{ haproxy_socket }} \
          | awk -F, 'NR>1 && $2!="FRONTEND" && $2!="BACKEND" && $1!="stats" && $18 !~ /^UP/ {print $1"/"$2" "$18}'
      register: hp_down
      until: hp_down.stdout == ''
      retries: 10
      delay: 3
      changed_when: false

    - name: Exporter sees Galera synced and LDAP up on both nodes
      ansible.builtin.shell: |
        curl -s 127.0.0.1:9200/metrics | grep -E '^webstore_(galera_synced|ldap_up|haproxy_up)' | grep -v ' 1.0$' || true
      register: mon_bad
      until: mon_bad.stdout == ''
      retries: 10
      delay: 6
      changed_when: false

    - name: Grafana
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/health"

    - name: Where to look
      ansible.builtin.debug:
        msg:
          - "Shop:          {{ shop_url }}/   ({{ shop_vip_ip }})"
          - "Admin:         {{ shop_url }}/admin.html   (admin / lab_password)"
          - "HAProxy stats: http://{{ ops_ip }}:{{ haproxy_stats_port }}/"
          - "Grafana:       http://{{ ops_ip }}:{{ grafana_port }}/   (admin / lab_password)"
