---
- name: Drain a shop host
  hosts: webstore_shop
  become: true
  gather_facts: true
  vars:
    haproxy_server: "{{ target }}"
  pre_tasks:
    - name: Require target extra-var
      ansible.builtin.assert:
        that:
          - target is defined
          - target in groups['webstore_shop']
        fail_msg: "Pass -e target=web-frontend1.lab.rippa.io"

- name: Move VIP off the target if it owns it
  hosts: "{{ target }}"
  become: true
  gather_facts: true
  tasks:
    - name: Check whether this host holds the shop VIP
      ansible.builtin.command: ip -4 addr show
      register: addr
      changed_when: false
    - name: Stop keepalived so the VIP fails over
      ansible.builtin.systemd:
        name: keepalived
        state: stopped
      when: shop_vip_ip in addr.stdout

- name: Bleed the target out of both HAProxy instances
  hosts: webstore_shop
  become: true
  gather_facts: false
  vars:
    haproxy_server: "{{ target }}"
    haproxy_state: drain
  tasks:
    - ansible.builtin.include_role:
        name: haproxy_state
    - name: Wait until HAProxy shows zero current connections to the target
      ansible.builtin.shell: |
        echo "show stat" | socat stdio {{ haproxy_socket }} \
          | awk -F, -v n="{{ target }}" 'NR > 1 && $2 == n { c += $5 } END { print c + 0 }'
      register: scur
      until: scur.stdout | int == 0
      retries: 30
      delay: 2
      changed_when: false
    - name: Place target servers in maint
      ansible.builtin.include_role:
        name: haproxy_state
      vars:
        haproxy_state: maint

- name: Stop shop units on the target
  hosts: "{{ target }}"
  become: true
  gather_facts: false
  tasks:
    - name: Stop API, backend, httpd, haproxy
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: "{{ shop_api_units + shop_app_units }}"
    - name: Desync Galera
      ansible.builtin.shell: |
        set -a
        . /etc/webstore/webstore.env
        set +a
        podman exec webstore-mariadb mysql -u root -p"$MARIADB_ROOT_PASSWORD" \
          -e "SET GLOBAL wsrep_desync=ON"
      args:
        executable: /bin/bash
      failed_when: false
    - name: Stop MariaDB
      ansible.builtin.systemd:
        name: webstore-mariadb.service
        state: stopped
    - name: Stop 389-ds
      ansible.builtin.systemd:
        name: dirsrv@webstore
        state: stopped
