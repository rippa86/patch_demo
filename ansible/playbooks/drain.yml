---
# Take one shop node out cleanly:  ansible-playbook playbooks/drain.yml -e target=web-frontend1.lab.rippa.io
- name: Drain the target in HAProxy (demo-vm)
  hosts: webstore_ops
  become: true
  gather_facts: false
  vars:
    haproxy_server: "{{ hostvars[target].node_name }}"
  pre_tasks:
    - name: Require target
      ansible.builtin.assert:
        that:
          - target is defined
          - target in groups['webstore_shop']
        fail_msg: "Pass -e target=web-frontend1.lab.rippa.io"
  tasks:
    - name: Drain
      ansible.builtin.include_role:
        name: haproxy_state
      vars:
        haproxy_state: drain
    - name: Wait for its connections to finish
      ansible.builtin.shell: |
        echo "show stat" | socat stdio unix-connect:{{ haproxy_socket }} \
          | awk -F, -v n="{{ haproxy_server }}" 'NR > 1 && $2 == n { c += $5 } END { print c + 0 }'
      register: scur
      until: scur.stdout | int == 0
      retries: 30
      delay: 2
      changed_when: false
    - name: Maintenance mode
      ansible.builtin.include_role:
        name: haproxy_state
      vars:
        haproxy_state: maint

- name: Stop the target's services
  hosts: "{{ target }}"
  become: true
  gather_facts: false
  tasks:
    - name: Stop APIs, httpd, backend
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: "{{ shop_api_units + ['webstore-httpd.service', 'webstore-backend.service'] }}"
    - name: Stop MariaDB (the other node + garbd keep quorum)
      ansible.builtin.systemd:
        name: webstore-mariadb.service
        state: stopped
    - name: Stop 389-ds
      ansible.builtin.systemd:
        name: dirsrv@webstore
        state: stopped
