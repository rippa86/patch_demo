---
- name: Gather shop facts
  hosts: webstore_shop
  gather_facts: true

- name: Point web-frontend1 at the full gcomm list and start web-frontend2
  hosts: webstore_shop
  become: true
  vars:
    galera_bootstrap: false
  tasks:
    - name: Addresses
      ansible.builtin.set_fact:
        frontend1_ip: "{{ hostvars['web-frontend1.lab.rippa.io'].ansible_default_ipv4.address }}"
        frontend2_ip: "{{ hostvars['web-frontend2.lab.rippa.io'].ansible_default_ipv4.address }}"
    - name: Read MariaDB root password
      ansible.builtin.command: awk -F= '/^MARIADB_ROOT_PASSWORD=/ {print substr($0, index($0,$2))}' /etc/webstore/webstore.env
      register: mariadb_pw
      changed_when: false
    - name: Template running Galera config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../deploy/galera/galera.cnf.j2"
        dest: /etc/webstore/galera.cnf
        mode: "0644"
      vars:
        mariadb_root_password: "{{ mariadb_pw.stdout }}"
    - name: Start MariaDB on web-frontend2 (joins web-frontend1)
      ansible.builtin.systemd:
        name: webstore-mariadb.service
        state: started
        enabled: true
      when: inventory_hostname == 'web-frontend2.lab.rippa.io'

- name: Start garbd on ops
  hosts: webstore_ops
  become: true
  tasks:
    - name: Start Galera arbitrator
      ansible.builtin.systemd:
        name: webstore-garbd.service
        state: started
        enabled: true
