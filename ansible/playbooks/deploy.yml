---
- name: Discover shop IPs from host facts
  hosts: webstore_shop
  become: true
  gather_facts: true
  tasks:
    - name: Record peer and cluster addresses from facts
      ansible.builtin.set_fact:
        keepalived_interface: "{{ ansible_default_ipv4.interface }}"
        keepalived_peer_ip: "{{ hostvars[peer].ansible_default_ipv4.address }}"
        frontend1_ip: "{{ hostvars['web-frontend1.lab.rippa.io'].ansible_default_ipv4.address }}"
        frontend2_ip: "{{ hostvars['web-frontend2.lab.rippa.io'].ansible_default_ipv4.address }}"
      vars:
        peer: "{{ groups['webstore_shop'] | difference([inventory_hostname]) | first }}"
    - name: Show resolved addressing
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} {{ ansible_default_ipv4.address }} iface={{ keepalived_interface }}"
          - "peer={{ keepalived_peer_ip }}"
          - "VIP {{ shop_vip_dns }}={{ shop_vip_ip }}"
          - "garbd {{ galera_garbd_ip }}"

- name: Lab /etc/hosts so FQDNs work without site DNS
  hosts: webstore
  become: true
  tasks:
    - name: Host entries
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "{{ item.re }}"
        line: "{{ item.line }}"
      loop:
        - { re: "web-frontend1\\.lab\\.rippa\\.io$", line: "{{ hostvars['web-frontend1.lab.rippa.io'].ansible_default_ipv4.address }} web-frontend1.lab.rippa.io" }
        - { re: "web-frontend2\\.lab\\.rippa\\.io$", line: "{{ hostvars['web-frontend2.lab.rippa.io'].ansible_default_ipv4.address }} web-frontend2.lab.rippa.io" }
        - { re: "shoppingapp\\.lab\\.rippa\\.io$", line: "{{ shop_vip_ip }} shoppingapp.lab.rippa.io" }
        - { re: "demo-vm\\.lab\\.rippa\\.io$", line: "{{ galera_garbd_ip }} demo-vm.lab.rippa.io" }

- name: Packages and directories on shop hosts
  hosts: webstore_shop
  become: true
  tasks:
    - name: Install host packages
      ansible.builtin.dnf:
        name:
          - podman
          - keepalived
          - socat
          - rsync
          - 389-ds-base
          - openldap-clients
        state: present
    - name: Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "{{ '0700' if item == '/etc/webstore' else ('1777' if item == '/var/run/webstore' else '0755') }}"
      loop:
        - /opt/webstore
        - /etc/webstore
        - /etc/containers/systemd
        - /var/run/webstore
        - /etc/keepalived
    - name: Persist /var/run/webstore
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../deploy/tmpfiles-webstore.conf"
        dest: /etc/tmpfiles.d/webstore.conf

- name: Packages on ops host
  hosts: webstore_ops
  become: true
  tasks:
    - name: Install podman
      ansible.builtin.dnf:
        name:
          - podman
          - rsync
        state: present
    - name: Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - /opt/webstore
        - /etc/webstore
        - /etc/containers/systemd

- name: Ship selected source trees
  hosts: webstore
  become: true
  tasks:
    - name: Copy application sources
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ item }}"
        dest: /opt/webstore/
      loop:
        - backend
        - api-account
        - api-login
        - api-logout
        - api-cart
        - api-stats
        - frontend
        - dashboard
        - synth-users
        - deploy
        - ansible

- name: Shop host config and images
  hosts: webstore_shop
  become: true
  tasks:
    - name: Env file from example if missing
      ansible.builtin.copy:
        src: "{{ repo_dest }}/deploy/env.example"
        dest: /etc/webstore/webstore.env
        remote_src: true
        mode: "0600"
        force: false
    - name: Fill discovered IPs into env
      ansible.builtin.lineinfile:
        path: /etc/webstore/webstore.env
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: FRONTEND1_IP, value: "{{ frontend1_ip }}" }
        - { key: FRONTEND2_IP, value: "{{ frontend2_ip }}" }
        - { key: SHOP_VIP_IP, value: "{{ shop_vip_ip }}" }
        - { key: LDAP_URL, value: "ldap://{{ ansible_default_ipv4.address }}:389" }
        - { key: LDAP_PEER_URL, value: "ldap://{{ keepalived_peer_ip }}:389" }
        - { key: PEER_BACKEND_URL, value: "http://{{ keepalived_peer_ip }}:8001" }
    - name: Read MariaDB root password from env
      ansible.builtin.command: awk -F= '/^MARIADB_ROOT_PASSWORD=/ {print substr($0, index($0,$2))}' /etc/webstore/webstore.env
      register: mariadb_pw
      changed_when: false
    - name: Template Galera config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../deploy/galera/galera.cnf.j2"
        dest: /etc/webstore/galera.cnf
        mode: "0644"
      vars:
        mariadb_root_password: "{{ mariadb_pw.stdout }}"
    - name: Template keepalived
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../deploy/keepalived/keepalived.conf.j2"
        dest: /etc/keepalived/keepalived.conf
        mode: "0600"
    - name: Install shop quadlets
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../deploy/quadlets/{{ item }}"
        dest: "/etc/containers/systemd/{{ item }}"
      loop:
        - webstore-net.network
        - webstore-mariadb-data.volume
        - webstore-mariadb.container
        - webstore-backend.container
        - webstore-api-account.container
        - webstore-api-login.container
        - webstore-api-logout.container
        - webstore-api-cart.container
        - webstore-api-stats.container
        - webstore-httpd.container
        - webstore-haproxy.container
    - name: Read Directory Manager password
      ansible.builtin.command: awk -F= '/^LDAP_MANAGER_PASSWORD=/ {print substr($0, index($0,$2))}' /etc/webstore/webstore.env
      register: ldap_pw
      changed_when: false
    - name: Template 389-ds instance inf
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../deploy/ldap/instance.inf.j2"
        dest: /etc/webstore/instance.inf
        mode: "0600"
      vars:
        ldap_manager_password: "{{ ldap_pw.stdout }}"
    - name: Build application images
      ansible.builtin.command: "podman build -t {{ item.tag }} {{ item.path }}"
      args:
        chdir: "{{ repo_dest }}"
      loop:
        - { tag: "localhost/webstore-backend:1.0", path: "{{ repo_dest }}/backend" }
        - { tag: "localhost/webstore-api-account:1.0", path: "{{ repo_dest }}/api-account" }
        - { tag: "localhost/webstore-api-login:1.0", path: "{{ repo_dest }}/api-login" }
        - { tag: "localhost/webstore-api-logout:1.0", path: "{{ repo_dest }}/api-logout" }
        - { tag: "localhost/webstore-api-cart:1.0", path: "{{ repo_dest }}/api-cart" }
        - { tag: "localhost/webstore-api-stats:1.0", path: "{{ repo_dest }}/api-stats" }
        - { tag: "localhost/webstore-httpd:1.0", path: "{{ repo_dest }}/frontend" }
    - name: Reload systemd
      ansible.builtin.command: systemctl daemon-reload

- name: Ops host images and quadlets
  hosts: webstore_ops
  become: true
  tasks:
    - name: Env file from example if missing
      ansible.builtin.copy:
        src: "{{ repo_dest }}/deploy/env.example"
        dest: /etc/webstore/webstore.env
        remote_src: true
        mode: "0600"
        force: false
    - name: Ops quadlets
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../deploy/quadlets/{{ item }}"
        dest: "/etc/containers/systemd/{{ item }}"
      loop:
        - webstore-httpd-dash.container
        - webstore-garbd.container
        - webstore-synth-users.container
    - name: Build ops images
      ansible.builtin.command: "podman build -t {{ item.tag }} {{ item.extra | default('') }} {{ item.path }}"
      loop:
        - { tag: "localhost/webstore-httpd-dash:1.0", path: "{{ repo_dest }}/dashboard" }
        - { tag: "localhost/webstore-synth-users:1.0", path: "{{ repo_dest }}/synth-users" }
        - { tag: "localhost/webstore-garbd:1.0", path: "{{ repo_dest }}/deploy/galera", extra: "-f {{ repo_dest }}/deploy/galera/Containerfile.garbd" }
    - name: Reload systemd
      ansible.builtin.command: systemctl daemon-reload
