---
- name: Restore a shop host
  hosts: "{{ target }}"
  become: true
  gather_facts: true
  pre_tasks:
    - name: Require target extra-var
      ansible.builtin.assert:
        that:
          - target is defined
        fail_msg: "Pass -e target=web-frontend1.lab.rippa.io"

  tasks:
    - name: Start 389-ds
      ansible.builtin.systemd:
        name: dirsrv@webstore
        state: started
        enabled: true
    - name: Wait for LDAP
      ansible.builtin.wait_for:
        port: 389
        delay: 2
        timeout: 60
    - name: Start MariaDB (joins existing Primary)
      ansible.builtin.systemd:
        name: webstore-mariadb.service
        state: started
        enabled: true
    - name: Wait for Galera local port
      ansible.builtin.wait_for:
        port: 3306
        timeout: 120
    - name: Start backend
      ansible.builtin.systemd:
        name: webstore-backend.service
        state: started
    - name: Wait for backend health
      ansible.builtin.uri:
        url: http://127.0.0.1:8001/healthz
        status_code: 200
      register: backend_health
      until: backend_health.status == 200
      retries: 30
      delay: 4
    - name: Start APIs and httpd
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
      loop: "{{ shop_api_units + ['webstore-httpd.service', 'webstore-haproxy.service'] }}"
    - name: Start keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: started
        enabled: true

- name: Re-enable the target in HAProxy
  hosts: webstore_shop
  become: true
  gather_facts: false
  vars:
    haproxy_server: "{{ target }}"
    haproxy_state: ready
  tasks:
    - ansible.builtin.include_role:
        name: haproxy_state
