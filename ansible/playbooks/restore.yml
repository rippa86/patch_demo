---
# Bring a drained node back:  ansible-playbook playbooks/restore.yml -e target=web-frontend1.lab.rippa.io -e lab_password='...'
- name: Start the target's services
  hosts: "{{ target }}"
  become: true
  gather_facts: false
  pre_tasks:
    - name: Check the inventory loaded the lab settings
      ansible.builtin.include_role:
        name: common
        tasks_from: check_inventory

    - name: Require target
      ansible.builtin.assert:
        that:
          - target is defined
          - target in groups['webstore_shop']
        fail_msg: "Pass -e target=web-frontend1.lab.rippa.io"
  tasks:
    - name: 389-ds
      ansible.builtin.systemd:
        name: dirsrv@webstore
        state: started
    - name: Wait for LDAP
      ansible.builtin.wait_for:
        port: 389
        timeout: 60
    - name: Clear stale SST state before rejoining
      ansible.builtin.include_role:
        name: galera
        tasks_from: clear_stale_sst
    - name: MariaDB (rejoins via IST)
      ansible.builtin.systemd:
        name: webstore-mariadb.service
        state: started
    - name: Wait for Galera sync
      ansible.builtin.include_role:
        name: galera
        tasks_from: wait_synced
    - name: Backend, APIs, httpd
      ansible.builtin.include_role:
        name: shop_apps
        tasks_from: start

- name: Put the target back into HAProxy
  hosts: webstore_ops
  become: true
  gather_facts: false
  tasks:
    - name: Ready
      ansible.builtin.include_role:
        name: haproxy_state
      vars:
        haproxy_server: "{{ hostvars[target].node_name }}"
        haproxy_state: ready
