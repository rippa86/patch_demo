---
# Set one shop node's state in every HAProxy backend (runs on demo-vm).
# vars: haproxy_server (HAProxy server name, e.g. web-frontend1), haproxy_state (ready|drain|maint)
- name: "HAProxy: {{ haproxy_server }} -> {{ haproxy_state }}"
  ansible.builtin.shell: |
    set -e
    for be in {{ haproxy_backends | join(' ') }}; do
      echo "set server ${be}/{{ haproxy_server }} state {{ haproxy_state }}" \
        | socat stdio unix-connect:{{ haproxy_socket }}
    done
  changed_when: true
