# Lab inventory. Used by ansible.cfg and by AAP ("Sourced from a Project",
# inventory file: ansible/hosts.ini). It must stay next to group_vars/ and
# host_vars/: that is how Ansible finds the lab settings for these hosts.
# IPs live in group_vars/all/main.yml; the SSH user comes from your AAP
# Machine credential (or -u / ansible_user locally).

[webstore_shop]
web-frontend1.lab.rippa.io
web-frontend2.lab.rippa.io

[webstore_ops]
demo-vm.lab.rippa.io

[webstore:children]
webstore_shop
webstore_ops
