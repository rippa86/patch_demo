# Prometheus on demo-vm. Everything comes from webstore-exporter, which polls
# HAProxy, MariaDB/Galera and 389-ds on both shop nodes each scrape.
global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 30s

scrape_configs:
  - job_name: webstore
    static_configs:
      - targets: ["127.0.0.1:9200"]
        labels:
          site: lab

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
