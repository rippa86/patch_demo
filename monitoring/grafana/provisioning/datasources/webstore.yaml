apiVersion: 1
datasources:
  - name: Prometheus
    uid: webstore-prom
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9091
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s

# Remove the MySQL datasource from the earlier single-panel Grafana setup.
deleteDatasources:
  - name: webstore-mariadb
    orgId: 1
