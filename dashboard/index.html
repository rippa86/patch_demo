<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logged-in users · webstore ops</title>
  <style>
    :root {
      --bg: #12140f;
      --fg: #e7eadf;
      --muted: #9aa392;
      --line: #2a2e24;
      --accent: #d7b377;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
    }
    header, main { padding: 24px 28px; }
    header { border-bottom: 1px solid var(--line); }
    .kicker { color: var(--muted); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { font-weight: 500; margin: 8px 0 0; }
    .count { font-size: 72px; line-height: 1; margin: 12px 0 8px; }
    canvas {
      width: 100%;
      height: 280px;
      background: #181b14;
      border: 1px solid var(--line);
    }
    .status { color: var(--muted); margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="kicker">demo-vm.lab.rippa.io</div>
    <h1>Users currently logged in</h1>
  </header>
  <main>
    <div class="count" id="count">—</div>
    <canvas id="chart" width="960" height="280"></canvas>
    <p class="status" id="status">Polling api-stats on web-frontend1 then web-frontend2. Not on shoppingapp VIP.</p>
  </main>
  <script src="/js/dashboard.js"></script>
</body>
</html>
